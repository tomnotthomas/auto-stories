# One-command setup for a fresh Linux container:
#
#   cp .env.example .env    # then fill in GOOGLE_CLOUD_API_KEY
#   docker compose up --build
#   # open http://localhost:3000
#
# Builds and runs the whole app (Angular + NestJS) as a single container.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    # Secrets come from .env at runtime — nothing is baked into the image.
    # The story engine needs GOOGLE_CLOUD_API_KEY; the app fails fast without it.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
    restart: unless-stopped
