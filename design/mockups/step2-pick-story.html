<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 1 — Pick + What's the story?</title>
<link rel="stylesheet" href="./base.css">
<style>
  /* Story-creation surface is always dark/immersive (like Instagram's).
     color-scheme on the whole device so the status bar strip is dark too. */
  .device{color-scheme:dark;background:var(--mat-sys-surface)}
  .statusbar{color:var(--mat-sys-on-surface)}
  .screen{color-scheme:dark;background:var(--mat-sys-surface)}

  .appbar{flex:none;display:flex;align-items:center;gap:4px;height:52px;padding:0 6px;background:var(--mat-sys-surface)}
  .appbar .title{font:var(--mat-sys-title-medium);color:var(--mat-sys-on-surface)}

  .grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:3px;overflow:hidden}
  .grid .cell{position:relative;overflow:hidden}
  .grid .cell .photo{position:absolute;inset:0}
  .grid .cell .x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
  .grid .cell .x .material-symbols-outlined{font-size:16px}
  .grid .add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--mat-sys-surface-container-high);color:var(--mat-sys-primary);border:none;cursor:pointer;font:var(--mat-sys-label-large)}
  .grid .add .material-symbols-outlined{font-size:30px}
  .grid .add small{font:var(--mat-sys-label-medium);color:var(--mat-sys-on-surface-variant)}

  .panel{flex:none;background:var(--mat-sys-surface);padding:16px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
  .field{background:var(--mat-sys-surface-container-highest);border-radius:8px 8px 0 0;border-bottom:2px solid var(--mat-sys-primary);padding:10px 16px}
  .field .fl{font:var(--mat-sys-body-small);color:var(--mat-sys-primary)}
  .field .fv{font:var(--mat-sys-body-large);color:var(--mat-sys-on-surface);margin-top:4px;line-height:1.4}
  .fhelp{display:flex;justify-content:space-between;font:var(--mat-sys-body-small);color:var(--mat-sys-on-surface-variant);padding:6px 4px 0;margin-top:-6px}
  .tone{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tone .lbl{font:var(--mat-sys-label-medium);color:var(--mat-sys-on-surface-variant);width:100%;margin-bottom:-2px}
  .tchip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 15px;border-radius:9px;border:1px solid var(--mat-sys-outline);background:transparent;color:var(--mat-sys-on-surface-variant);font:var(--mat-sys-label-large);cursor:pointer}
  .tchip[aria-selected=true]{background:var(--mat-sys-primary-container);color:var(--mat-sys-on-primary-container);border-color:transparent}
  .tchip .material-symbols-outlined{font-size:18px}
</style></head>
<body>
<div class="device">
  <div class="statusbar"><span>9:41</span><span>􀙱 􀖙 100%</span></div>
  <div class="screen">
    <div class="appbar">
      <button class="mat-icon-btn"><span class="material-symbols-outlined">arrow_back</span></button>
      <span class="title">New story</span>
    </div>
    <div class="grid">
      <div class="cell photo ph-sparkler"><span class="x"><span class="material-symbols-outlined">close</span></span></div>
      <div class="cell photo ph-cousins"><span class="x"><span class="material-symbols-outlined">close</span></span></div>
      <div class="cell photo ph-cake"><span class="x"><span class="material-symbols-outlined">close</span></span></div>
      <div class="cell photo ph-lake"><span class="x"><span class="material-symbols-outlined">close</span></span></div>
      <div class="cell photo ph-dock"><span class="x"><span class="material-symbols-outlined">close</span></span></div>
      <div class="cell photo ph-a"><span class="x"><span class="material-symbols-outlined">close</span></span></div>
      <div class="cell photo ph-b"><span class="x"><span class="material-symbols-outlined">close</span></span></div>
      <div class="cell photo ph-c"><span class="x"><span class="material-symbols-outlined">close</span></span></div>
      <button class="add"><span class="material-symbols-outlined">add_photo_alternate</span>Add<small>8 / 10</small></button>
    </div>
    <div class="panel">
      <div class="field">
        <div class="fl">What's the story?</div>
        <div class="fv">Maya's 1st birthday at the lake house, all the cousins came</div>
      </div>
      <div class="fhelp"><span>What happened, and the feeling.</span></div>
      <div class="tone">
        <span class="lbl">Tone · optional</span>
        <button class="tchip">😄 Funny</button>
        <button class="tchip" aria-selected="true"><span class="material-symbols-outlined">check</span>Heartfelt</button>
        <button class="tchip">🔥 Hype</button>
        <button class="tchip">😌 Chill</button>
      </div>
      <button class="mat-btn mat-filled lg block"><span class="material-symbols-outlined">auto_awesome</span>Create my story</button>
    </div>
  </div>
</div>
</body></html>
