<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 3 — Payoff (cinematic)</title>
<link rel="stylesheet" href="./base.css">
<style>
  .screen{color-scheme:dark}
  .story{flex:1;position:relative;display:flex;flex-direction:column;background:#000}
  .story .photo{position:absolute;inset:0}
  /* tap zones to advance/rewind frames (Stories convention) */
  .tapzone{position:absolute;top:80px;bottom:150px;width:38%;z-index:2}
  .tapzone.prev{left:0}.tapzone.next{right:0}
  .top{position:relative;z-index:3;padding:44px 12px 0}
  .row{display:flex;align-items:center;gap:10px;padding:12px}
  .row .name{color:#fff;font:var(--mat-sys-label-large)}
  .row .name small{display:block;color:rgba(255,255,255,.75);font-weight:400}
  .caption{position:absolute;z-index:3;left:20px;right:20px;bottom:118px;color:#fff}
  .kicker{font:var(--mat-sys-label-large);letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin-bottom:10px}
  .cap{font-weight:700;font-size:29px;line-height:1.13;text-shadow:0 2px 16px rgba(0,0,0,.55)}
  .tapnote{position:absolute;z-index:3;left:0;right:0;bottom:96px;text-align:center;color:rgba(255,255,255,.7);font:var(--mat-sys-label-small)}
  /* two-action bar */
  .actions{position:absolute;z-index:4;left:16px;right:16px;bottom:24px;display:flex;gap:12px}
  .actions .mat-btn{flex:1}
  .save-tonal{background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(6px)}
</style></head>
<body>
<div class="device">
  <div class="statusbar" style="color:#fff;position:absolute;z-index:5;width:100%"><span>9:41</span><span>􀙱 􀖙 100%</span></div>
  <div class="screen">
    <div class="story">
      <div class="photo ph-sparkler"></div>
      <div class="scrim"></div>
      <div class="tapzone prev"></div><div class="tapzone next"></div>
      <div class="top">
        <div class="segs"><span class="seg done"></span><span class="seg done"></span><span class="seg done"></span><span class="seg now"></span><span class="seg"></span></div>
        <div class="row">
          <div class="avatar">M</div>
          <div class="name">Maya turns one<small>Your story · frame 4 of 5</small></div>
        </div>
      </div>
      <div class="caption">
        <div class="coach"><span class="material-symbols-outlined">touch_app</span>Tap to edit &amp; move</div>
        <div class="cap editable">Then she blew it out, and every cousin cheered at once.</div>
      </div>
      <div class="tapnote">Tap the photo to move through the story</div>
      <div class="actions">
        <button class="mat-btn mat-filled lg block"><span class="material-symbols-outlined">tune</span>Refine story</button>
      </div>
    </div>
  </div>
</div>
</body></html>
