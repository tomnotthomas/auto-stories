<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step 1 — First-open wow</title>
<link rel="stylesheet" href="./base.css">
<style>
  .screen{color-scheme:dark}
  .story{flex:1;position:relative;display:flex;flex-direction:column;background:#000}
  .story .photo{position:absolute;inset:0}
  .top{position:relative;z-index:3;padding:12px 12px 0}
  .row{display:flex;align-items:center;gap:10px;padding:12px}
  .row .name{color:#fff;font:var(--mat-sys-label-large)}
  .row .name small{display:block;color:rgba(255,255,255,.75);font-weight:400}
  .badge{position:absolute;z-index:4;top:14px;right:14px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);color:#fff;font:var(--mat-sys-label-medium);padding:5px 12px;border-radius:100px}
  .caption{position:absolute;z-index:3;left:20px;right:20px;bottom:150px;color:#fff}
  .kicker{font:var(--mat-sys-label-large);letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin-bottom:10px}
  .cap{font-weight:700;font-size:29px;line-height:1.13;text-shadow:0 2px 16px rgba(0,0,0,.55)}
  .hint{position:absolute;z-index:3;left:0;right:0;bottom:112px;text-align:center;color:rgba(255,255,255,.85);font:var(--mat-sys-label-medium)}
  .cta{position:absolute;z-index:4;left:16px;right:16px;bottom:24px}
</style></head>
<body>
<div class="device">
  <div class="statusbar" style="color:#fff;position:absolute;z-index:5;width:100%"><span>9:41</span><span>􀙱 􀖙 100%</span></div>
  <div class="screen">
    <div class="story">
      <div class="photo ph-cake"></div>
      <div class="scrim"></div>
      <div class="top" style="padding-top:44px">
        <div class="segs"><span class="seg done"></span><span class="seg done"></span><span class="seg now"></span><span class="seg"></span><span class="seg"></span></div>
        <div class="row">
          <div class="avatar">M</div>
          <div class="name">Maya turns one<small>An example we made — yours is next</small></div>
        </div>
      </div>
      <div class="caption">
        <div class="coach"><span class="material-symbols-outlined">touch_app</span>Tap to edit &amp; move</div>
        <div class="cap editable">One candle, ten sets of hands ready to help her blow it out.</div>
      </div>
      <div class="hint">Tap the photo to see how it flows ›</div>
      <div class="cta">
        <button class="mat-btn mat-filled lg block"><span class="material-symbols-outlined">add_a_photo</span>Try it with your photos</button>
      </div>
    </div>
  </div>
</div>
</body></html>
