<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Error — timed out</title>
<link rel="stylesheet" href="./base.css">
<style>
  .screen{color-scheme:dark;background:var(--mat-sys-surface)}
  .wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 32px 40px}
  .pet{width:150px;height:150px;border-radius:50%;background:var(--mat-sys-surface-container-high);display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .pet svg{width:112px;height:112px;overflow:visible}
  .title{font:var(--mat-sys-headline-small);font-weight:700;color:var(--mat-sys-on-surface)}
  .body{font:var(--mat-sys-body-large);color:var(--mat-sys-on-surface-variant);margin-top:10px;max-width:310px;line-height:1.5}
  .link{margin-top:12px}
  .foot{flex:none;padding:0 24px 24px}
</style></head>
<body>
<div class="device">
  <div class="statusbar"><span>9:41</span><span>􀙱 􀖙 100%</span></div>
  <div class="screen">
    <div class="wrap">
      <div class="pet">
        <svg viewBox="0 0 120 120" role="img" aria-label="Waiting dog">
          <!-- tail, wags -->
          <path d="M0 0 Q 22 -4 28 -20" transform="translate(88 84)" stroke="#9a6234" stroke-width="12" fill="none" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" additive="sum" values="-16;16;-16" dur="0.5s" repeatCount="indefinite"/>
          </path>
          <!-- head group: gentle "looking around" tilt -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-4 60 62;4 60 62;-4 60 62" dur="3.4s" repeatCount="indefinite"/>
            <ellipse cx="32" cy="42" rx="12" ry="23" fill="#9a6234" transform="rotate(-18 32 42)"/>
            <ellipse cx="88" cy="42" rx="12" ry="23" fill="#9a6234" transform="rotate(18 88 42)"/>
            <circle cx="60" cy="56" r="35" fill="#c6884e"/>
            <ellipse cx="60" cy="72" rx="18" ry="14" fill="#ead0ac"/>
            <path d="M53 80 Q60 86 67 80" stroke="#5b3d22" stroke-width="3" fill="none" stroke-linecap="round"/>
            <ellipse cx="60" cy="64" rx="6" ry="5" fill="#3a2416"/>
            <circle cx="47" cy="50" r="4.6" fill="#3a2416"><animate attributeName="r" values="4.6;4.6;0.6;4.6" keyTimes="0;0.9;0.94;1" dur="3.4s" repeatCount="indefinite"/></circle>
            <circle cx="73" cy="50" r="4.6" fill="#3a2416"><animate attributeName="r" values="4.6;4.6;0.6;4.6" keyTimes="0;0.9;0.94;1" dur="3.4s" repeatCount="indefinite"/></circle>
          </g>
        </svg>
      </div>
      <div class="title">This is taking too long</div>
      <div class="body">The story didn't come back in time, so we stopped waiting — even the dog got bored. Your photos are safe, let's try again.</div>
      <button class="mat-btn mat-text link">Back to my photos</button>
    </div>
    <div class="foot">
      <button class="mat-btn mat-filled lg block"><span class="material-symbols-outlined">refresh</span>Try again</button>
    </div>
  </div>
</div>
</body></html>
