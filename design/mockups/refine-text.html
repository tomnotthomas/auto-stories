<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Refine — edit caption text</title>
<link rel="stylesheet" href="./base.css">
<style>
  .screen{color-scheme:dark}
  .story{flex:1;position:relative;background:#000;display:flex;flex-direction:column;overflow:hidden}
  .story .photo{position:absolute;inset:0}
  .dim{position:absolute;inset:0;background:rgba(0,0,0,.34)}

  .ebar{position:absolute;z-index:5;top:44px;left:0;right:0;display:flex;align-items:center;padding:6px 6px}
  .ebar .title{flex:1;text-align:center;color:#fff;font:var(--mat-sys-title-medium)}
  .ebar .done{color:var(--mat-sys-primary);font:var(--mat-sys-label-large);background:none;border:none;cursor:pointer;padding:8px 14px}
  .ebar .mat-icon-btn{color:#fff}

  /* the caption, selected and being placed */
  .selcap{position:absolute;z-index:3;left:44px;right:44px;top:250px;color:#fff;text-align:center}
  .selcap .cap{font-weight:700;font-size:26px;line-height:1.16;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .selcap .cap .caret{display:inline-block;width:3px;height:25px;background:#fff;margin-left:2px;transform:translateY(4px);animation:blink 1s step-start infinite}
  @keyframes blink{50%{opacity:0}}
  .sizehdr{font:var(--mat-sys-label-medium);color:var(--mat-sys-on-surface-variant);margin-bottom:-6px}
  .selbox{position:absolute;inset:-16px;border:1.5px solid rgba(255,255,255,.95);border-radius:8px}
  .h{position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--mat-sys-primary)}
  .h.tl{left:-8px;top:-8px}.h.tr{right:-8px;top:-8px}.h.bl{left:-8px;bottom:-8px}.h.br{right:-8px;bottom:-8px}
  .movetag{position:absolute;left:50%;top:-42px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.6);color:#fff;font:var(--mat-sys-label-small);padding:5px 11px;border-radius:100px;white-space:nowrap;backdrop-filter:blur(4px)}
  .movetag .material-symbols-outlined{font-size:14px}

  .sheet{position:absolute;z-index:4;left:0;right:0;bottom:0;background:var(--mat-sys-surface-container-low);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
  .grab{width:32px;height:4px;border-radius:2px;background:var(--mat-sys-outline-variant);margin:0 auto 2px}
  .editfield{background:var(--mat-sys-surface-container-highest);border-radius:8px 8px 0 0;border-bottom:2px solid var(--mat-sys-primary);padding:10px 14px}
  .editfield .fl{font:var(--mat-sys-body-small);color:var(--mat-sys-primary)}
  .editfield .txt{color:var(--mat-sys-on-surface);font:var(--mat-sys-body-large);margin-top:3px;display:flex;align-items:baseline}
  .editfield .caret{display:inline-block;width:2px;height:19px;background:var(--mat-sys-primary);margin-left:1px;transform:translateY(3px)}
  .sizerow{display:flex;align-items:center;gap:12px;color:var(--mat-sys-on-surface-variant)}
  .sizerow .as{font-weight:700}
  .sizerow .al{font-weight:700;font-size:20px}
  .quick{display:flex;gap:10px}
  .qbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;border-radius:100px;border:1px solid var(--mat-sys-outline);background:transparent;color:var(--mat-sys-on-surface);font:var(--mat-sys-label-large);cursor:pointer}
  .qbtn.on{background:var(--mat-sys-secondary-container);color:var(--mat-sys-on-secondary-container);border-color:transparent}
  .qbtn .material-symbols-outlined{font-size:18px}
</style></head>
<body>
<div class="device">
  <div class="statusbar" style="color:#fff;position:absolute;z-index:6;width:100%"><span>9:41</span><span>􀙱 􀖙 100%</span></div>
  <div class="screen">
    <div class="story">
      <div class="photo ph-sparkler"></div>
      <div class="dim"></div>

      <div class="ebar">
        <button class="mat-icon-btn"><span class="material-symbols-outlined">close</span></button>
        <span class="title">Edit caption</span>
        <button class="done">Done</button>
      </div>

      <div class="selcap">
        <div class="movetag"><span class="material-symbols-outlined">open_with</span>Drag to move</div>
        <div class="selbox">
          <span class="h tl"></span><span class="h tr"></span><span class="h bl"></span><span class="h br"></span>
        </div>
        <div class="cap">Then she blew it out, and every cousin cheered at once.<span class="caret"></span></div>
      </div>

      <div class="sheet">
        <div class="grab"></div>
        <div class="sizehdr">Text size</div>
        <div class="sizerow">
          <span class="as">A</span>
          <div class="mat-slider" style="flex:1"><div class="track"><div class="fill"></div></div><div class="knob"></div></div>
          <span class="al">A</span>
        </div>
        <div class="quick">
          <button class="qbtn"><span class="material-symbols-outlined">auto_awesome</span>Regenerate</button>
          <button class="qbtn on"><span class="material-symbols-outlined">contrast</span>Legibility</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
