<div class="story-surface min-h-dvh">
  @switch (story.phase()) {
    @case ('create') {
      <app-create />
    }
    @case ('generating') {
      <app-generating />
    }
    @case ('story') {
      <app-story />
    }
    @case ('error') {
      <app-error />
    }
    @default {
      <app-example />
    }
  }
</div>
