<!-- Click-through overlay: only the dots and blooms take pointer events, so tapping
     the photo between sparks still pages the story underneath. -->
<div class="pointer-events-none absolute inset-0 z-20">
  <!-- Music is story-level (no anchor), so it docks as a chip near the top, where
       Instagram's music sticker lives. Copy the search term for the hand-off. -->
  @if (music().length) {
    <div class="pointer-events-auto absolute left-1/2 top-16 flex -translate-x-1/2 flex-col gap-1.5">
      @for (track of music(); track track.index) {
        <div
          data-spark-music
          class="drop-in flex max-w-[280px] items-center gap-2 rounded-full border border-white/10 bg-surface-container-high py-1 pl-3 pr-1 text-on-surface shadow-lg"
        >
          <mat-icon class="flex-none text-primary">music_note</mat-icon>
          <span data-spark-music-query class="mat-label-large min-w-0 flex-1 truncate">
            {{ track.query }}
          </span>
          <button matButton class="flex-none" (click)="copy(track)">
            {{ copiedIndex() === track.index ? 'Copied' : 'Copy' }}
          </button>
          <button
            matIconButton
            data-spark-music-dismiss
            class="flex-none"
            aria-label="Dismiss music suggestion"
            (click)="dismiss(track)"
          >
            <mat-icon>close</mat-icon>
          </button>
        </div>
      }
    </div>
  }

  @for (spark of sparks(); track spark.index) {
    <div
      data-spark
      class="pointer-events-auto absolute -translate-x-1/2 -translate-y-1/2"
      [style.left.%]="spark.xPct"
      [style.top.%]="spark.yPct"
    >
      <!-- The dot: a tappable anchor at the suggested spot. Tap to bloom; flick
           sideways to dismiss. `touch-none` so the flick doesn't scroll the page. -->
      <button
        type="button"
        data-spark-dot
        [attr.aria-label]="'Suggested ' + spark.label + ': ' + spark.query"
        [attr.aria-expanded]="openIndex() === spark.index"
        (click)="onTap(spark.index)"
        (pointerdown)="onPointerDown($event, spark)"
        (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp($event, spark)"
        (pointercancel)="onPointerCancel($event)"
        class="press relative flex h-9 w-9 touch-none items-center justify-center rounded-full text-on-primary shadow-lg"
        [class]="spark.done ? 'bg-primary/60' : 'bg-primary'"
        [style.transform]="'translateX(' + flickDx(spark.index) + 'px)'"
      >
        @if (!spark.done) {
          <span aria-hidden="true" class="spark-pulse absolute inset-0 rounded-full bg-primary"></span>
        }
        <mat-icon class="relative h-5 w-5 text-[20px] leading-none">
          {{ spark.done ? 'check' : spark.icon }}
        </mat-icon>
      </button>

      <!-- The bloom: the ghost of the element, scaling out from its dot. The
           recommendation (icon + what + the exact term) sits on its own row so it
           always has the full width; the actions (Copy for the hand-off, Done,
           Dismiss) sit on a second row and can't crowd the term. -->
      @if (openIndex() === spark.index) {
        <div
          class="drop-in absolute bottom-full left-1/2 mb-2 flex w-60 max-w-[80vw] -translate-x-1/2 flex-col gap-2 rounded-2xl border border-white/10 bg-surface-container-high p-3 text-on-surface shadow-xl"
        >
          <div class="flex items-start gap-2">
            <mat-icon class="flex-none text-primary">{{ spark.icon }}</mat-icon>
            <div class="min-w-0 flex-1">
              <p class="mat-label-medium text-on-surface-variant">{{ spark.label }}</p>
              <p data-spark-query class="mat-label-large break-words text-on-surface">
                {{ spark.query }}
              </p>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button matButton="filled" class="flex-1" (click)="copy(spark)">
              <mat-icon>{{ copiedIndex() === spark.index ? 'check' : 'content_copy' }}</mat-icon>
              {{ copiedIndex() === spark.index ? 'Copied' : 'Copy' }}
            </button>
            <button
              matIconButton
              data-spark-done
              class="flex-none"
              [attr.aria-label]="spark.done ? 'Mark not added' : 'Mark added in Instagram'"
              [attr.aria-pressed]="spark.done"
              (click)="toggleDone(spark)"
            >
              <mat-icon>{{ spark.done ? 'check_circle' : 'radio_button_unchecked' }}</mat-icon>
            </button>
            <button
              matIconButton
              data-spark-dismiss
              class="flex-none"
              aria-label="Dismiss suggestion"
              (click)="dismiss(spark)"
            >
              <mat-icon>close</mat-icon>
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
