<section class="relative flex h-dvh flex-col overflow-hidden bg-black text-white">
  @if (current(); as frame) {
    @if (frame.previewUrl) {
      <img [src]="frame.previewUrl" alt="" class="absolute inset-0 h-full w-full object-cover" />
    }
    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80"></div>

    <!-- Tap zones: left third goes back, right advances (Stories convention) -->
    <button
      type="button"
      aria-label="Previous frame"
      (click)="prev()"
      class="absolute bottom-32 left-0 top-20 z-10 w-2/5"
    ></button>
    <button
      type="button"
      aria-label="Next frame"
      (click)="next()"
      class="absolute bottom-32 right-0 top-20 z-10 w-3/5"
    ></button>

    <header class="relative z-20 flex gap-1 px-3 pt-11">
      @for (f of frames(); track $index) {
        <span
          class="h-[3px] flex-1 rounded bg-white"
          [class.opacity-40]="$index > currentIndex()"
        ></span>
      }
    </header>

    @if (partial() && !bannerDismissed()) {
      <div
        class="absolute inset-x-3.5 top-[104px] z-30 flex items-center gap-2.5 rounded-2xl border border-white/10 bg-surface-container-high p-3 shadow-lg"
      >
        <mat-icon class="text-primary">auto_fix_high</mat-icon>
        <span class="mat-label-large flex-1 text-on-surface"
          >1 photo didn't fit the story — we used {{ frameCount() }} of {{ pickedCount() }}.</span
        >
        <button type="button" aria-label="Dismiss notice" (click)="dismissBanner()" class="text-on-surface-variant">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }

    <div class="absolute inset-x-5 bottom-28 z-20">
      <p class="story-caption inline-block rounded-2xl bg-black/40 px-4 py-3">{{ frame.caption }}</p>
    </div>

    <div class="absolute inset-x-4 bottom-6 z-30">
      <button matButton="filled" class="w-full" (click)="startOver()">
        <mat-icon>refresh</mat-icon>
        Start over
      </button>
    </div>
  }
</section>
