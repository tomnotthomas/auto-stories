<!-- The hand-off card: grows in place where the action button was, shown before
     we hand off so the add-ons are seen while still on our screen. -->
<div
  class="handoff-card absolute inset-x-4 bottom-6 z-40 flex flex-col gap-3 rounded-3xl bg-surface p-4 text-on-surface shadow-2xl"
>
  <div class="flex items-center gap-2">
    <mat-icon class="text-primary">ios_share</mat-icon>
    <h2 class="mat-title-medium flex-1">Add in Instagram</h2>
    <button matIconButton data-tray-close aria-label="Not now" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  @if (hero(); as h) {
    <!-- The one to lead with — big, the exact term fully readable, copy inline. -->
    <div data-tray-item class="flex items-center gap-3 rounded-2xl bg-surface-container-high p-3">
      <mat-icon class="flex-none text-primary">{{ h.icon }}</mat-icon>
      <div class="min-w-0 flex-1">
        <p class="mat-label-medium text-on-surface-variant">{{ h.label }}</p>
        <p data-tray-term class="mat-title-medium font-medium leading-snug">{{ h.query }}</p>
      </div>
      <button matButton="filled" class="flex-none" (click)="copy(h)">
        <mat-icon>{{ copiedKey() === h.key ? 'check' : 'content_copy' }}</mat-icon>
        {{ copiedKey() === h.key ? 'Copied' : 'Copy' }}
      </button>
      <button
        matIconButton
        data-tray-dismiss
        class="flex-none"
        [attr.aria-label]="'Remove ' + h.query"
        (click)="dismiss(h)"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Anything else, quieter — same readable term, lighter copy. -->
    @for (item of rest(); track item.key) {
      <div data-tray-item class="flex items-center gap-3 pl-1">
        <mat-icon class="flex-none text-on-surface-variant">{{ item.icon }}</mat-icon>
        <p data-tray-term class="mat-body-medium min-w-0 flex-1 leading-snug">{{ item.query }}</p>
        <button matButton class="flex-none" (click)="copy(item)">
          {{ copiedKey() === item.key ? 'Copied' : 'Copy' }}
        </button>
        <button
          matIconButton
          data-tray-dismiss
          class="flex-none"
          [attr.aria-label]="'Remove ' + item.query"
          (click)="dismiss(item)"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }
  }

  <button matButton="filled" class="w-full" [disabled]="busy()" (click)="saveAndOpen()">
    <mat-icon>ios_share</mat-icon>
    {{ busy() ? 'Preparing…' : 'Save & open Instagram' }}
  </button>
</div>
