<div class="flex flex-col gap-2" cdkDropList (cdkDropListDropped)="onReorder($event)">
  @for (thumb of thumbs(); track thumb.photoId; let i = $index) {
    <div
      class="flex items-center gap-3 rounded-2xl bg-surface-container p-2"
      cdkDrag
    >
      <mat-icon class="flex-none text-on-surface-variant" cdkDragHandle>drag_indicator</mat-icon>
      <button
        type="button"
        [attr.aria-label]="'View frame ' + (i + 1)"
        (click)="onSelect(i)"
        class="h-14 w-14 flex-none overflow-hidden rounded-xl ring-2"
        [class]="i === current() ? 'ring-primary' : 'ring-transparent'"
      >
        @if (thumb.previewUrl) {
          <img [src]="thumb.previewUrl" alt="" class="h-full w-full object-cover" />
        }
      </button>
      <span class="mat-label-large flex-1 truncate text-on-surface">{{ thumb.caption }}</span>
      @if (canDrop()) {
        <button
          matIconButton
          type="button"
          aria-label="Drop frame"
          (click)="onDrop(thumb.photoId)"
          class="flex-none text-on-surface-variant"
        >
          <mat-icon>delete</mat-icon>
        </button>
      }
    </div>
  }
  @if (!isFull()) {
    <label
      class="flex cursor-pointer items-center gap-3 rounded-2xl border border-dashed border-outline p-2 text-primary"
    >
      <input type="file" accept="image/*" multiple hidden aria-label="Add photos" (change)="onPick($event)" />
      <span
        class="flex h-14 w-14 flex-none items-center justify-center rounded-xl bg-surface-container-high"
      >
        <mat-icon>add</mat-icon>
      </span>
      <span class="mat-label-large">Add a photo</span>
    </label>
  }
</div>
