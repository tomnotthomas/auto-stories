<!-- Overlays the frame photo (rendered by the parent). Dims it so the controls
     read, and captures taps so a tap outside the text doesn't page the story.
     #surface is the drag reference for the text box. -->
<div
  #surface
  class="overlay-fade absolute inset-0 z-30 bg-black/40"
  (pointermove)="onDrag($event, surface)"
  (pointerup)="endDrag($event, surface)"
  (pointercancel)="endDrag($event, surface)"
>
  <!-- Edit bar -->
  <div class="absolute inset-x-0 top-0 z-10 flex items-center px-2 pt-11 text-white">
    <button matIconButton aria-label="Close editor" (click)="done.emit()">
      <mat-icon>close</mat-icon>
    </button>
    <span class="mat-title-medium flex-1 text-center">Edit text</span>
    <button matButton (click)="done.emit()">Done</button>
  </div>

  <!-- The text, selected and placed. Where the host stores a placement, drag
       anywhere on the box with one finger to move it and pinch to resize. -->
  <div
    class="absolute z-10 w-[78%] max-w-[320px] -translate-x-1/2 -translate-y-1/2 touch-none select-none"
    [style.left.%]="posX()"
    [style.top.%]="posY()"
    (pointerdown)="startDrag($event, surface)"
  >
    <div
      class="pointer-events-none absolute -inset-4 rounded-lg border-[1.5px] border-white/95"
    ></div>

    @if (movable()) {
      <div
        class="pointer-events-none absolute -top-12 left-1/2 flex -translate-x-1/2 items-center gap-1.5 whitespace-nowrap rounded-full bg-black/60 px-3 py-1.5 text-white"
      >
        <mat-icon class="h-[14px] w-[14px] text-[14px] leading-none">open_with</mat-icon>
        <span class="mat-label-small">Drag to move · pinch to resize</span>
      </div>
    }

    <div [class]="legibility() ? 'rounded-2xl bg-black/40 px-4 py-3' : 'px-1'">
      <!-- touch-none: a <textarea> is a form control that starts its own touch
           scroll/selection, which overrode the box's touch-action and made Chrome
           fire pointercancel a few pixels into a drag. Setting it here keeps the
           one-finger drag alive; tap-to-type still works. -->
      <textarea
        cdkTextareaAutosize
        aria-label="Frame text"
        class="caption-input block w-full resize-none touch-none border-none bg-transparent text-center font-bold leading-tight text-white outline-none"
        [style.fontSize.px]="fontSize()"
        [value]="draft()"
        (input)="onHeadlineInput($event)"
      ></textarea>
    </div>
  </div>

  <!-- Bottom sheet: size, then Regenerate + Legibility (mockup refine-text.html).
       Size and Legibility appear only when the host can store the result. -->
  <div
    class="sheet-enter absolute inset-x-0 bottom-0 z-10 flex flex-col gap-3 rounded-t-3xl bg-surface-container-low px-5 pb-6 pt-3 text-on-surface"
  >
    <span class="mx-auto h-1 w-8 rounded-full bg-outline-variant"></span>
    @if (placement(); as p) {
      <span class="mat-label-medium text-on-surface-variant">Text size</span>
      <div class="flex items-center gap-3">
        <span class="font-bold">A</span>
        <mat-slider class="flex-1" min="0.6" max="1.8" step="0.1">
          <input
            matSliderThumb
            aria-label="Text size"
            [value]="p.scale"
            (valueChange)="onScale($event)"
          />
        </mat-slider>
        <span class="text-xl font-bold">A</span>
      </div>
    }
    <div class="flex items-stretch gap-3">
      @if (!demo()) {
        <button matButton="outlined" class="flex-1" [disabled]="busy()" (click)="regenerate.emit()">
          @if (busy()) {
            <mat-spinner diameter="18" />
          } @else {
            <mat-icon>auto_awesome</mat-icon>
          }
          Regenerate
        </button>
      }
      @if (legibility() !== null) {
        <button
          [matButton]="legibility() ? 'tonal' : 'outlined'"
          class="flex-1"
          [attr.aria-pressed]="legibility()"
          (click)="legibilityToggle.emit()"
        >
          <mat-icon>contrast</mat-icon>
          Legibility
        </button>
      }
      @if (removable()) {
        <button matButton="outlined" class="flex-1" (click)="remove.emit()">
          <mat-icon>delete</mat-icon>
          Remove
        </button>
      }
    </div>
  </div>
</div>
