<section class="relative flex h-full flex-col overflow-hidden bg-black text-white">
  <!-- The user's photos, stacked; the active one fades in over the previous. -->
  @for (photo of photos(); track photo.id; let i = $index) {
    <img
      [src]="photo.previewUrl"
      alt=""
      class="absolute inset-0 h-full w-full object-cover transition-opacity duration-500 ease-out"
      [class.opacity-100]="i === activePhoto()"
      [class.opacity-0]="i !== activePhoto()"
    />
  }
  <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-black/20 to-black/95"></div>

  <div class="relative z-10 mt-auto flex flex-col gap-5 p-6 pb-10">
    <h1 class="mat-headline-small">Building your story…</h1>
    <mat-progress-bar mode="indeterminate" aria-label="Building your story" />
    <ul class="flex flex-col gap-4">
      @for (step of steps; track step; let i = $index) {
        <li
          class="flex items-center gap-3 transition-opacity duration-200 ease-out"
          [class.opacity-50]="i > activeStep()"
        >
          <mat-icon class="text-primary">{{
            i < activeStep() ? 'check_circle' : 'radio_button_unchecked'
          }}</mat-icon>
          <span class="mat-label-large">{{ step }}</span>
        </li>
      }
    </ul>
  </div>
</section>
