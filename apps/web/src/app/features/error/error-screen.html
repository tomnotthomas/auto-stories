<section class="flex h-full flex-col items-center justify-center gap-4 bg-surface px-8 text-center text-on-surface">
  <mat-icon class="h-16 w-16 text-[64px] text-primary">sentiment_dissatisfied</mat-icon>
  <h1 class="mat-headline-small">That didn't work</h1>
  <p class="mat-label-large max-w-xs text-on-surface-variant">{{ error()?.message }}</p>

  <div class="mt-4 flex w-full max-w-xs flex-col gap-2">
    <button matButton="filled" (click)="tryAgain()">
      <mat-icon>refresh</mat-icon>
      Try again
    </button>
    <button matButton (click)="startOver()">Start over</button>
  </div>
</section>
