<section class="flex h-dvh flex-col bg-surface text-on-surface">
  <div class="flex h-13 flex-none items-center gap-1 px-1.5">
    <button matIconButton aria-label="Back to example" (click)="back()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="mat-title-medium">New story</h1>
  </div>

  <!-- Auto-sizing photo grid: fills the top, holds 3–10, fewer = bigger (5.4) -->
  <div class="grid flex-1 auto-rows-fr grid-cols-3 gap-[3px] overflow-hidden">
    @for (photo of story.photos(); track photo.id) {
      <div class="relative overflow-hidden">
        <img [src]="photo.previewUrl" alt="" class="absolute inset-0 h-full w-full object-cover" />
        <button
          type="button"
          aria-label="Remove photo"
          (click)="story.removePhoto(photo.id)"
          class="absolute right-1.5 top-1.5 flex h-6 w-6 items-center justify-center rounded-full bg-black/55 text-white backdrop-blur-sm"
        >
          <mat-icon class="h-4 w-4 text-base leading-none">close</mat-icon>
        </button>
      </div>
    }
    @if (!story.isFull()) {
      <label
        class="flex cursor-pointer flex-col items-center justify-center gap-0.5 bg-surface-container-high text-primary"
      >
        <input
          type="file"
          accept="image/*"
          multiple
          hidden
          aria-label="Add photos"
          (change)="onPick($event)"
        />
        <mat-icon>add_photo_alternate</mat-icon>
        <span class="mat-label-large">Add</span>
        <small class="mat-label-medium text-on-surface-variant"
          >{{ story.photoCount() }} / {{ maxPhotos }}</small
        >
      </label>
    }
  </div>

  <!-- Story line + tone + submit -->
  <div class="flex flex-none flex-col gap-3.5 bg-surface px-5 pb-6 pt-4">
    <mat-form-field appearance="fill">
      <mat-label>What's the story?</mat-label>
      <textarea
        matInput
        #storyInput
        cdkTextareaAutosize
        cdkAutosizeMinRows="1"
        cdkAutosizeMaxRows="3"
        [value]="story.storyLine()"
        (input)="story.setStoryLine(storyInput.value)"
        placeholder="Maya's 1st birthday at the lake house, all the cousins came"
      ></textarea>
      <mat-hint>What happened, and the feeling.</mat-hint>
      @if (showCounter) {
        <mat-hint align="end">{{ story.storyLine().length }} / {{ maxStoryLength }}</mat-hint>
      }
    </mat-form-field>

    <div>
      <p class="mat-label-medium mb-1 text-on-surface-variant">Tone · optional</p>
      <mat-chip-listbox aria-label="Tone" (change)="onToneChange($event)">
        @for (t of tones; track t.value) {
          <mat-chip-option [value]="t.value" [selected]="story.tone() === t.value"
            >{{ t.emoji }} {{ t.label }}</mat-chip-option
          >
        }
      </mat-chip-listbox>
    </div>

    <button matButton="filled" class="w-full" [disabled]="!story.canGenerate()" (click)="create()">
      <mat-icon>auto_awesome</mat-icon>
      Create my story
    </button>
  </div>
</section>
