type: object
description: |
  The lifecycle state of an async generation job. `done` carries `result`;
  `failed` carries `error`. Delivered over SSE (`GET /jobs/{id}/events`) and as
  JSON (`GET /jobs/{id}`). `queued` → `processing` → `done` | `failed`; the last
  two are terminal.
required: [status]
additionalProperties: false
properties:
  status:
    type: string
    enum: [queued, processing, done, failed]
    description: The job's phase. `done` and `failed` are terminal.
  frames:
    type: array
    description: |
      The frames the model has written **so far**, in order — sent while
      `processing` so the client can show each choice as it is made rather than
      all of them at the end (decision 7.30). Advisory and cumulative: each
      event carries the whole list known at that moment, and `result` on the
      terminal `done` event is the authoritative story.
    items:
      $ref: './Frame.yaml'
  result:
    description: The finished story. Present only when status is `done`.
    $ref: './GenerateResponse.yaml'
  error:
    type: object
    description: The typed failure. Present only when status is `failed`.
    required: [code, message]
    additionalProperties: false
    properties:
      code:
        $ref: './ErrorCode.yaml'
      message:
        type: string
        description: Human-readable message safe to surface to the user.
      retryAt:
        type: string
        format: date-time
        description: |
          When the caller may try again, for the refusals that pass on their
          own. The shared daily budget is reserved inside the job, so
          `quota_exhausted` reaches the client here rather than on the accept
          — this is the path that carries its reset time (decision 7.36).
