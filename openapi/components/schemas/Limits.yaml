type: object
description: |
  What the caller has left under the shared free tier's fair-use guardrails
  (approach 4.1). Read before generating so the client can say what is left
  *before* the user picks photos and writes their line, rather than only after
  a refusal (decision 7.36). Reading this does not count against any limit.
required: [remaining, limit, resetAt, dayExhausted]
additionalProperties: false
properties:
  remaining:
    type: integer
    minimum: 0
    description: Stories this caller can still start in the current hour.
    examples: [2]
  limit:
    type: integer
    minimum: 1
    description: Stories one caller may start per hour. Sent so the client can
      say "2 of 5" without hardcoding a number the server owns.
    examples: [5]
  resetAt:
    type: string
    format: date-time
    description: When the caller's hour window rolls over and `remaining`
      returns to `limit`.
    examples: ['2026-08-06T15:00:00.000Z']
  dayExhausted:
    type: boolean
    description: |
      The *shared* daily budget is spent, so nobody can generate until it
      resets — regardless of what `remaining` says. Deliberately a flag and not
      a count: it is not this caller's allowance, and a number they cannot act
      on would only read as a scoreboard.
    examples: [false]
  dayResetAt:
    type: string
    format: date-time
    description: When the shared daily budget resets. Present only when
      `dayExhausted` is true.
