type: object
description: >-
  One placed text element the layout agent composed for a frame (decision 7.21):
  a label, title, or deck with its own face, size, tracking, leading, and place.
  Text colour and any scrim are computed on-device for legibility (decision 7.10),
  never chosen here.
required: [role, text, font, weight, case, align, size, tracking, leading, x, y, anchor]
additionalProperties: false
properties:
  role:
    type: string
    description: What the element is, so hierarchy reads even though placement is free.
    enum: [label, title, deck]
    examples:
      - title
  text:
    type: string
    minLength: 1
    examples:
      - Golden hour
  font:
    type: string
    enum: [inter, playfair, space-mono, caveat]
    examples:
      - playfair
  weight:
    type: string
    enum: [regular, bold]
    examples:
      - bold
  case:
    type: string
    enum: [normal, upper]
    examples:
      - normal
  align:
    type: string
    description: Text alignment within the (possibly multi-line) block.
    enum: [left, center, right]
    examples:
      - left
  size:
    type: integer
    minimum: 0
    maximum: 6
    description: Index into the client's modular size ramp (0 smallest … 6 largest).
    examples:
      - 4
  tracking:
    type: string
    enum: [tight, normal, wide]
    examples:
      - normal
  leading:
    type: string
    enum: [tight, normal, loose]
    examples:
      - tight
  x:
    type: number
    minimum: 0
    maximum: 100
    description: Anchor point x, as a percentage of the frame width.
    examples:
      - 8
  y:
    type: number
    minimum: 0
    maximum: 100
    description: Anchor point y, as a percentage of the frame height.
    examples:
      - 12
  anchor:
    type: string
    description: Which point of the element's box sits at (x, y), so a corner-anchored block extends inward and stays on-screen.
    enum:
      - top-left
      - top
      - top-right
      - left
      - center
      - right
      - bottom-left
      - bottom
      - bottom-right
    examples:
      - top-left
  stack:
    type: boolean
    description: Break the text into one word per line (the vertical-stack move).
    examples:
      - false
  accent:
    type: boolean
    description: >-
      Render this element in the story's accent colour (a designer's one pop of
      colour) instead of the computed white/dark. The client derives the actual
      hue from the photo and guarantees legibility (7.10); the model only marks
      the intent. Use on at most one element per frame.
    examples:
      - false
  underline:
    type: boolean
    description: >-
      Draw a hand-drawn underline in the accent colour beneath this element (a
      designer's scribbled mark). Sparingly — at most one per frame.
    examples:
      - false
