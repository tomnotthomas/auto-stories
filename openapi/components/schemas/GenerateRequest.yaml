type: object
required: [story, photos]
additionalProperties: false
properties:
  story:
    type: string
    description: The user's one-line "What's the story?" answer — drives ordering and grounds captions.
    minLength: 1
    maxLength: 280
    examples:
      - Maya's 1st birthday at the lake house, all the cousins came
  tone:
    $ref: './Tone.yaml'
  photos:
    type: array
    description: 3–30 downscaled photos — a real dump the model selects from, not a pre-filtered handful.
    minItems: 3
    maxItems: 30
    items:
      $ref: './Photo.yaml'
  mustInclude:
    type: array
    description: >-
      Photo ids the model must include and caption even past the target length.
      Set when a photo is added by hand during refine, so it always gets a caption.
    maxItems: 30
    items:
      type: string
