type: object
description: Every non-2xx response uses this shape.
required: [error]
additionalProperties: false
properties:
  error:
    type: object
    required: [code, message]
    additionalProperties: false
    properties:
      code:
        $ref: './ErrorCode.yaml'
      message:
        type: string
        description: Human-readable message safe to surface to the user.
        examples:
          - That's your stories for today — everyone gets a turn.
      retryAt:
        type: string
        format: date-time
        description: |
          When the caller may try again, for the refusals that pass on their
          own — both `rate_limited` and `quota_exhausted` when the day rolls
          over. Absent for failures with no known recovery time.
          Present so the client can say *when* instead of "shortly", and so a
          retry button is not offered before it can possibly work (7.36).
        examples:
          - '2026-08-06T15:00:00.000Z'
