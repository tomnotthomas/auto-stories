type: object
description: >-
  One chosen photo in narrative order, with the words that go on it. The story's
  Look decides how those words are set and where they sit (decision 7.24); the
  model supplies no type, position or size.
required: [photoId, order, headline]
additionalProperties: false
properties:
  photoId:
    type: string
    description: The id of the chosen photo (matches a Photo.id from the request).
    examples:
      - p2
  order:
    type: integer
    description: 1-based position in the story.
    minimum: 1
    examples:
      - 1
  kicker:
    type: string
    minLength: 1
    description: >-
      Optional short line above the headline (decision 7.24). Each Look decides
      whether to show it and how to set it — Magazine renders it as a spaced
      all-caps eyebrow, Quiet Editorial as a letter-spaced kicker, Minimal drops
      it entirely.
    examples:
      - The Ascent
  headline:
    type: string
    description: >-
      The frame's words — the one piece of text on the photo (decision 7.25).
      Short: the design sets it large and the words fit the band, rather than the
      band growing to fit the words. **Empty means silent** — some photos speak
      for themselves, so the frame is kept and the Look composes it without
      words (decision 7.26). It is a choice, not a missing value.
    examples:
      - Where the mountain meets its mirror
  emphasis:
    type: string
    minLength: 1
    description: >-
      A word or phrase inside `headline` to mark — the Look decides how (accent
      underline, colour block, hand-drawn stroke) and some Looks ignore it. The
      client skips the mark when this is absent or is not found in `headline`.
    examples:
      - mountain
  suggestions:
    type: array
    description: >-
      Optional Instagram add-ons for this frame (0-2). Metadata only — the app
      shows them as in-app "sparks"; nothing is baked into the exported image.
    items:
      $ref: ./Suggestion.yaml
