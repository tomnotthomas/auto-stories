type: object
description: One chosen photo in narrative order, with its caption and style.
required: [photoId, order, caption, headline]
additionalProperties: false
properties:
  photoId:
    type: string
    description: The id of the chosen photo (matches a Photo.id from the request).
    examples:
      - p2
  order:
    type: integer
    description: 1-based position in the story.
    minimum: 1
    examples:
      - 1
  caption:
    type: string
    description: Caption grounded in the story line and what's visible.
    examples:
      - The moment she saw the cake — pure disbelief.
  style:
    $ref: ./Style.yaml
  texts:
    type: array
    maxItems: 2
    description: >-
      Placed caption blocks (0–2). The editorial layer: a frame may carry a small
      line and a bigger line, each with its own text, style, and spot. When the
      model omits this, the client falls back to the single `caption` + `style`.
    items:
      $ref: ./TextBlock.yaml
  suggestions:
    type: array
    description: >-
      Optional Instagram add-ons for this frame (0-2). Metadata only — the app
      shows them as in-app "sparks"; nothing is baked into the exported image.
    items:
      $ref: ./Suggestion.yaml
  kicker:
    type: string
    minLength: 1
    description: >-
      Optional short line above the headline (decision 7.24). Each Look decides
      whether to show it and how to set it — Magazine renders it as a spaced
      all-caps eyebrow, Quiet Editorial as a letter-spaced kicker, Minimal drops
      it entirely.
    examples:
      - The Ascent
  headline:
    type: string
    minLength: 1
    description: >-
      The frame's main line (decision 7.24). Short — the Looks set it large.
      Always present: the server falls back to `caption` when the model omits it,
      so a frame can always compose.
    examples:
      - Where the mountain meets its mirror
  emphasis:
    type: string
    minLength: 1
    description: >-
      A word or phrase inside `headline` to mark — the Look decides how (accent
      underline, colour block, hand-drawn stroke) and some Looks ignore it. The
      client skips the mark when this is absent or is not found in `headline`.
    examples:
      - mountain
