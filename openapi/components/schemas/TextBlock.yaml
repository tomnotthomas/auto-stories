type: object
description: >-
  One piece of caption text placed on the frame. A frame carries 0–2 blocks
  (usually 0–1 — let the photo breathe): a small line and a bigger line, each
  with its own text, style, and spot. The client computes text colour and any
  background/scrim for readability (decision 7.10) and lets the user toggle it —
  the model never chooses those.
required: [text, font, weight, case, align, size, position]
additionalProperties: false
properties:
  text:
    type: string
    minLength: 1
    description: The words to show — short, often just one or two.
    examples:
      - Yummy.
  font:
    type: string
    enum: [inter, playfair, space-mono, caveat]
    examples:
      - inter
  weight:
    type: string
    enum: [regular, bold]
    examples:
      - bold
  case:
    type: string
    enum: [normal, upper]
    examples:
      - normal
  align:
    type: string
    enum: [left, center, right]
    examples:
      - center
  size:
    type: string
    enum: [s, m, l]
    description: This block's own size, so a small line and a bigger line can share a frame.
    examples:
      - l
  position:
    type: string
    description: Anchor zone (2 rows x 3 columns), kept off the subject in the middle.
    enum:
      - top-left
      - top-center
      - top-right
      - bottom-left
      - bottom-center
      - bottom-right
    examples:
      - bottom-left
