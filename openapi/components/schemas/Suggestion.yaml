type: object
description: >-
  An optional Instagram add-on the model suggests for a frame (a place/mention
  tag, a GIF sticker, a poll, or music). The user adds it in Instagram via the
  hand-off; the app shows it as an in-app "spark" and never bakes it into the
  exported image. The model says only what the add-on is and how sure it is —
  never where it goes: the client places it in the free space the frame's design
  leaves, and drops a suggestion that has no room rather than placing it badly
  (decision 7.25).
required: [type, query, confidence]
additionalProperties: false
properties:
  type:
    type: string
    description: Which Instagram element to add.
    enum: [location, mention, gif, poll, music]
    examples:
      - location
  query:
    type: string
    description: >-
      The exact text to search for in Instagram — a place name, a GIF term, a
      song or genre, or a poll question. Must be accurate and searchable: a
      name, not an @handle (Instagram's own search resolves the tag).
    examples:
      - Blue Bottle Coffee, Hayes Valley
  confidence:
    type: number
    description: 0..1 — how sure the model is; low-confidence suggestions read tentative.
    minimum: 0
    maximum: 1
    examples:
      - 0.9
