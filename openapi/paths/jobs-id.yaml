get:
  operationId: getJob
  tags: [story]
  summary: Get the current state of a generation job.
  description: |
    Polling fallback for the SSE stream. Returns the job's current
    JobState. An unknown or evicted id is a 404.
  parameters:
    - name: id
      in: path
      required: true
      description: The job id returned by POST /api/v1/generate.
      schema:
        type: string
  responses:
    '200':
      description: The job's current state.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/JobState.yaml'
    '404':
      description: No such job — unknown id, or the job expired and was evicted.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ErrorResponse.yaml'
