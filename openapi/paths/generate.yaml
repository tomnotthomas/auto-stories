post:
  operationId: generateStory
  tags: [story]
  summary: Generate an ordered, captioned story from a batch of photos.
  description: |
    Takes 3–30 downscaled photos plus the user's story line (and optional
    tone). Generation runs as a background job so a large batch can't hold the
    request open past the host's timeout: this returns **202 with a jobId**, and
    the finished story arrives over SSE at `GET /api/v1/jobs/{jobId}/events`
    (or poll `GET /api/v1/jobs/{jobId}`). Model-outcome failures (empty result,
    quota, timeout) surface inside the job's state on that stream, not here.
    Every client-side check (type, count, size) is re-validated here — the
    server is the authority.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/GenerateRequest.yaml'
        examples:
          birthday:
            summary: Heartfelt birthday, three photos
            description: The guided story line plus a tone chip — the common happy path.
            value:
              story: Maya's 1st birthday at the lake house, all the cousins came
              tone: heartfelt
              photos:
                - id: p1
                  b64: /9j/4AAQSkZJRgABAQ...<truncated downscaled jpeg>...2Q==
                  takenAt: '2026-07-04T09:12:00Z'
                - id: p2
                  b64: /9j/4AAQSkZJRgABAQ...<truncated downscaled jpeg>...9k=
                  takenAt: '2026-07-04T11:40:00Z'
                - id: p3
                  b64: /9j/4AAQSkZJRgABAQ...<truncated downscaled jpeg>...8A=
                  takenAt: '2026-07-04T16:05:00Z'
          minimal:
            summary: No tone, no timestamps
            description: Tone is optional; EXIF `takenAt` is optional. This is the smallest valid request.
            value:
              story: Morning surf session with the crew before the storm rolled in
              photos:
                - id: a
                  b64: /9j/4AAQSkZJRgABAQ...<truncated downscaled jpeg>...1Q==
                - id: b
                  b64: /9j/4AAQSkZJRgABAQ...<truncated downscaled jpeg>...2A=
                - id: c
                  b64: /9j/4AAQSkZJRgABAQ...<truncated downscaled jpeg>...3C=
  responses:
    '202':
      description: |
        The generation job was accepted. Open the SSE stream at
        `GET /api/v1/jobs/{jobId}/events` for the finished story.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/GenerateAccepted.yaml'
          examples:
            accepted:
              summary: Job accepted
              value:
                jobId: b1f2c3d4-5e6f-7a8b-9c0d-1e2f3a4b5c6d
    # Only the checks that run BEFORE the job is enqueued surface as HTTP errors
    # here. Model-outcome failures (empty_result, quota_exhausted, timeout) are
    # delivered inside the job's state over the SSE stream.
    '400':
      $ref: '../components/responses/BadRequest.yaml'
    '413':
      $ref: '../components/responses/PayloadTooLarge.yaml'
    '429':
      $ref: '../components/responses/RateLimited.yaml'
