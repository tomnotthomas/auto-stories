name: CI

on:
  push:
    branches: [main]
  pull_request:

# The detect-changes job (dorny/paths-filter) lists a PR's files via the GitHub
# API, which needs pull-requests: read. Without it, PR runs fail at "Detect
# changed areas" with "Resource not accessible by integration" and every
# downstream job is skipped.
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas of the monorepo changed, so we only run the CI for those.
  # A change to a shared root file (deps, this workflow) runs everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
            contract:
              - *shared
              - 'openapi/**'
              - 'packages/api-types/**'
            backend:
              - *shared
              - 'apps/api/**'
            frontend:
              - *shared
              - 'apps/web/**'
            # NOTE: the contract (packages/api-types) is a shared dependency of both
            # apps. It is intentionally NOT listed under backend/frontend, so a spec
            # change only runs the contract CI. To also verify consumers on a contract
            # change, add 'packages/api-types/**' to the backend and frontend filters.

  contract:
    name: API contract
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint the OpenAPI spec
        run: npm run openapi:lint

      - name: Check generated types are in sync with the spec
        run: |
          npm run openapi:types
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated API types are out of date. Run 'npm run openapi:types' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Typecheck the generated types
        run: npm run typecheck --workspace packages/api-types

  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace apps/api

      - name: Test
        run: npm run test --workspace apps/api

      - name: Build
        run: npm run build --workspace apps/api

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        # The web app uses Angular's @angular/build:unit-test (Vitest) builder;
        # --browsers=ChromeHeadless is a Karma-era flag it rejects. The package
        # script already passes --watch=false.
        run: npm run test --workspace apps/web

      - name: Build
        run: npm run build --workspace apps/web

  # End-to-end tests across the running frontend + backend will be added here later.
