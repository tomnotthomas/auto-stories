name: CI

on:
  push:
    branches: [main]
  pull_request:

# The detect-changes job (dorny/paths-filter) lists a PR's files via the GitHub
# API, which needs pull-requests: read. Without it, PR runs fail with "Resource
# not accessible by integration" and every downstream job is skipped.
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas of the monorepo changed, so we only run the CI for those.
  # A change to a shared root file (deps, this workflow) runs everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'package-lock.json'
            contract:
              - *shared
              - 'openapi/**'
              - 'packages/api-types/**'
            backend:
              - *shared
              - 'apps/api/**'
            frontend:
              - *shared
              - 'apps/web/**'
            # The image bundles both apps, so any app/dep/contract change — or the
            # container files themselves — must rebuild and re-smoke-test it.
            docker:
              - *shared
              - 'apps/**'
              - 'packages/api-types/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
            # NOTE: the contract (packages/api-types) is a shared dependency of both
            # apps. It is intentionally NOT listed under backend/frontend, so a spec
            # change only runs the contract CI. To also verify consumers on a contract
            # change, add 'packages/api-types/**' to the backend and frontend filters.

  contract:
    name: API contract
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint the OpenAPI spec
        run: npm run openapi:lint

      - name: Check generated types are in sync with the spec
        run: |
          npm run openapi:types
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated API types are out of date. Run 'npm run openapi:types' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Typecheck the generated types
        run: npm run typecheck --workspace packages/api-types

  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci --workspace apps/api

      - name: Typecheck
        run: npm run typecheck --workspace apps/api

      - name: Test (with coverage gate)
        run: npm run test:cov --workspace apps/api

      # Jest's rootDir is `src`, so the unit run never sees these. Without this
      # step the e2e suite drifts from the routes silently — it did, through the
      # move to async generation (6.1) and the Looks engine (7.24).
      - name: Test (end-to-end)
        run: npm run test:e2e --workspace apps/api

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/api/coverage
          if-no-files-found: warn

      - name: Build
        run: npm run build --workspace apps/api

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        # The web app uses Angular's @angular/build:unit-test (Vitest) builder;
        # --browsers=ChromeHeadless is a Karma-era flag it rejects. The package
        # script already passes --watch=false.
        run: npm run test --workspace apps/web

      - name: Build
        run: npm run build --workspace apps/web

  # Build the single deployable container and prove it actually serves the app:
  # the API health probe answers and the built web app is returned at the root.
  docker:
    name: Docker image
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: auto-stories:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the running container
        run: |
          # A dummy key lets the story engine boot; /healthz and / never call the model.
          docker run -d --name auto-stories -p 3000:3000 \
            -e GOOGLE_CLOUD_API_KEY=ci-smoke-test auto-stories:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz >/dev/null; then
              up=1; break
            fi
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "::error::/healthz never became ready"; docker logs auto-stories; exit 1
          fi

          echo "healthz OK; checking the landing page is served at /"
          curl -fsS http://localhost:3000/ | grep -qi 'your photos already have a story' \
            || { echo "::error::landing page not served at /"; docker logs auto-stories; exit 1; }
          echo "landing served at /; checking the web app is served at /app"
          curl -fsS http://localhost:3000/app/ | grep -qi '<app-root' \
            || { echo "::error::web app not served at /app"; docker logs auto-stories; exit 1; }
          echo "web app served at /app"
          # The legal pages are separate COPYs in the Dockerfile and resolve
          # extensionless only because of serveStaticOptions.extensions. Both
          # are easy to lose silently, so both are pinned here.
          for path in /privacy /privacy.html /imprint /imprint.html; do
            curl -fsS "http://localhost:3000$path" | grep -qi 'Auto Stories' \
              || { echo "::error::legal page not served at $path"; docker logs auto-stories; exit 1; }
          done
          echo "legal pages served at /privacy and /imprint"

      - name: Tear down
        if: always()
        run: docker rm -f auto-stories || true

  # End-to-end tests across the running frontend + backend will be added here later.
