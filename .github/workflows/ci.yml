name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint the OpenAPI spec
        run: npm run openapi:lint

      - name: Check generated types are in sync with the spec
        run: |
          npm run openapi:types
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated API types are out of date. Run 'npm run openapi:types' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Typecheck workspaces
        run: npm run typecheck
